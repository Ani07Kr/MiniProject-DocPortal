<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>DocConnect | Add Specialist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #e0f2fe;
            --accent: #0d9488;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
            --dark: #0f172a;
            --gray-700: #334155;
            --gray-500: #64748b;
            --gray-100: #f1f5f9;
            --white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.96);
            --shadow-lg: 0 20px 40px rgba(15, 23, 42, 0.12);
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, rgba(240, 249, 255, 0.92) 0%, rgba(240, 253, 250, 0.94) 100%), 
                        url('images/indr.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--dark);
        }

        /* --- NAVBAR --- */
        .navbar {
            height: 72px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.85);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--dark);
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: var(--accent-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .brand-text h2 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--dark);
        }

        .brand-text span {
            color: var(--primary);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-link {
            text-decoration: none;
            color: var(--gray-700);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 14px;
        }

        .btn-header {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            background: var(--primary-light);
            color: var(--primary-dark);
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.88rem;
            border: 1px solid #bae6fd;
        }

        /* --- MAIN WRAPPER --- */
        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 5%;
        }

        .doctor-card {
            width: 100%;
            max-width: 520px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: var(--shadow-lg);
            padding: clamp(24px, 5vw, 40px);
        }

        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 14px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .card-header h1 {
            font-size: clamp(1.5rem, 3.5vw, 1.9rem);
            font-weight: 800;
            color: var(--dark);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .card-header p {
            font-size: 0.9rem;
            color: var(--gray-500);
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: var(--gray-700);
            font-size: 0.86rem;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: var(--radius-md);
            font-size: 16px; /* Prevents auto zoom on iOS */
            color: var(--dark);
            background: #f8fafc;
            transition: all 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
            background: var(--white);
            outline: none;
            box-shadow: 0 0 0 3.5px rgba(2, 132, 199, 0.18);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: var(--accent-gradient);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
        }

        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.88rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .footer-nav a {
            text-decoration: none;
            color: var(--primary);
            font-weight: 700;
        }

        .footer-nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- TOP NAVBAR -->
    <nav class="navbar">
        <a href="Welcome.html" class="brand">
            <div class="brand-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                    <path d="M12 9v6m-3-3h6"/>
                </svg>
            </div>
            <div class="brand-text">
                <h2>Doc<span>Connect</span></h2>
            </div>
        </a>

        <div class="nav-actions">
            <a href="dashboard.html" class="btn-link">Dashboard</a>
            <a href="DoctorServlet?action=view" class="btn-header">Doctor Roster</a>
        </div>
    </nav>

    <!-- MAIN FORM -->
    <main class="main-wrapper">
        <div class="doctor-card">
            <div class="card-header">
                <div class="badge-pill">Directory Expansion</div>
                <h1>Add New Doctor</h1>
                <p>Register specialist profile into hospital directory</p>
            </div>

            <form action="DoctorServlet" method="post">
                <div class="form-group">
                    <label for="name">Doctor Full Name:</label>
                    <input type="text" id="name" name="name" required placeholder="e.g. Dr. Rajesh Verma">
                </div>

                <div class="form-group">
                    <label for="specialty">Medical Specialty:</label>
                    <input type="text" id="specialty" name="specialty" required placeholder="e.g. Cardiology, Orthopedics...">
                </div>

                <div class="form-group">
                    <label for="contact">Contact Phone Number:</label>
                    <input type="text" id="contact" name="contact" required placeholder="e.g. +91 9876543210">
                </div>

                <button type="submit" class="submit-btn">
                    <span>Register Doctor in Roster</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </form>

            <div class="footer-nav">
                <a href="dashboard.html">← Back to Dashboard</a>
                <a href="DoctorServlet?action=view">Browse Directory →</a>
            </div>
        </div>
    </main>

</body>
</html>
