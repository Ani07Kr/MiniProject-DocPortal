<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>DocPortal - Add New Doctor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.75), rgba(13, 148, 136, 0.65)), url('images/indr.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 14px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            padding: clamp(22px, 5vw, 36px);
            margin: auto;
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 6px;
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.88rem;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: #334155;
            font-size: 0.86rem;
        }

        input[type="text"], select {
            width: 100%;
            padding: 11px 13px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px; /* Prevents auto zoom on iOS */
            background-color: #f8fafc;
            color: #0f172a;
            transition: all 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: #0284c7;
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.18);
        }

        input[type="submit"] {
            background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
            color: white;
            padding: 13px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            width: 100%;
            transition: all 0.25s;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
            margin-top: 8px;
            min-height: 48px;
        }

        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
        }

        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.86rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .footer-nav a {
            text-decoration: none;
            color: #0284c7;
            font-weight: 700;
        }

        .footer-nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍⚕️ Add New Doctor</h1>
        <p class="subtitle">Register specialist profile in hospital directory</p>

        <form action="DoctorServlet" method="post">
            <div class="form-group">
                <label for="name">Doctor Full Name:</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Dr. Rajesh Verma">
            </div>

            <div class="form-group">
                <label for="specialty">Medical Specialty:</label>
                <input type="text" id="specialty" name="specialty" required placeholder="e.g. Cardiology, Dermatology, etc.">
            </div>

            <div class="form-group">
                <label for="contact">Contact Phone Number:</label>
                <input type="text" id="contact" name="contact" required placeholder="e.g. +91-9876543210">
            </div>

            <input type="submit" value="Register Doctor">
        </form>

        <div class="footer-nav">
            <a href="DoctorServlet?action=view">📋 View Doctor Directory</a>
            <a href="dashboard.html">← Return to Dashboard</a>
        </div>
    </div>
</body>
</html>
