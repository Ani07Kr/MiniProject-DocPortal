<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>DocPortal - Manage Appointment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.75), rgba(13, 148, 136, 0.65)), url('images/Dc2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 14px;
        }

        .container {
            width: 100%;
            max-width: 640px;
            margin: auto;
            padding: clamp(22px, 5vw, 38px);
            background: rgba(255, 255, 255, 0.98);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 6px;
            font-size: clamp(1.4rem, 4vw, 1.85rem);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.88rem;
            margin-bottom: 22px;
        }

        .radio-group {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 12px;
        }

        .radio-label {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 0;
            padding: 10px 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: clamp(0.82rem, 2.5vw, 0.92rem);
            color: #475569;
            border-radius: 8px;
            transition: all 0.2s;
            user-select: none;
            min-height: 42px;
        }

        .radio-label input[type="radio"] {
            display: none;
        }

        .radio-label.active {
            background: #0284c7;
            color: #fff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: #334155;
            font-size: 0.86rem;
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 11px 13px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px; /* Prevents auto zoom on mobile Safari */
            background-color: #f8fafc;
            color: #0f172a;
            transition: all 0.2s;
        }

        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            border-color: #0284c7;
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.18);
        }

        input[readonly] {
            background-color: #e2e8f0;
            color: #475569;
            cursor: not-allowed;
        }

        .slot-badge {
            background-color: #e0f2fe;
            border-left: 4px solid #0284c7;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: #0369a1;
            margin-top: 8px;
            border-radius: 0 8px 8px 0;
            line-height: 1.4;
        }

        input[type="submit"] {
            background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
            color: white;
            padding: 13px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            width: 100%;
            transition: all 0.25s;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
            margin-top: 8px;
            min-height: 48px;
        }

        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
        }

        .nav-links-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.86rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-links-footer a {
            text-decoration: none;
            color: #0284c7;
            font-weight: 700;
        }

        .nav-links-footer a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        function validateForm() {
            var action = document.querySelector('input[name="action"]:checked').value;
            var appointmentId = document.getElementById("appointmentId").value;
            var doctorName = document.getElementById("doctorName").value;
            var patientId = document.getElementById("patientId").value;
            var patientName = document.getElementById("patientName").value;
            var appointmentDate = document.getElementById("appointmentDate").value;
            var timeSlot = document.getElementById("timeSlot").value;

            if (action === "book" || action === "update") {
                if (!doctorName || !patientId || !patientName || !appointmentDate || !timeSlot) {
                    alert("Please fill out all required fields, including Doctor selection and Time Slot.");
                    return false;
                }
            } else if (action === "cancel") {
                if (!appointmentId) {
                    alert("Please enter the appointment ID to cancel.");
                    return false;
                }
            }
            return true;
        }

        function updateFormFields() {
            var actionRadio = document.querySelector('input[name="action"]:checked');
            if (!actionRadio) return;
            var action = actionRadio.value;
            var formGroups = document.querySelectorAll('.booking-field');
            var appointmentIdField = document.getElementById("appointmentId");

            // Update tab UI styling
            document.querySelectorAll('.radio-label').forEach(el => el.classList.remove('active'));
            actionRadio.closest('.radio-label').classList.add('active');

            if (action === "cancel") {
                appointmentIdField.removeAttribute("readonly");
                appointmentIdField.value = "";
                formGroups.forEach(el => el.style.display = "none");
            } else {
                formGroups.forEach(el => el.style.display = "block");
                if (action === "book") {
                    generateAppointmentId();
                    appointmentIdField.setAttribute("readonly", true);
                } else {
                    appointmentIdField.removeAttribute("readonly");
                }
            }
        }

        function generateAppointmentId() {
            document.getElementById("appointmentId").value = "APPT" + Math.floor(1000 + Math.random() * 9000);
        }

        // Dynamically load doctor list from database API
        function loadDoctors() {
            fetch('DoctorServlet?action=json')
                .then(response => {
                    if (response.ok) return response.json();
                    return null;
                })
                .then(data => {
                    if (data && data.length > 0) {
                        var select = document.getElementById("doctorName");
                        select.innerHTML = '<option value="">-- Choose Doctor by Specialty --</option>';
                        data.forEach(function(doc) {
                            var opt = document.createElement("option");
                            opt.value = doc.name;
                            opt.textContent = doc.name + " (" + doc.specialty + ")";
                            select.appendChild(opt);
                        });
                    }
                })
                .catch(err => {
                    console.log("Using default doctor list:", err);
                });
        }

        window.onload = function() {
            updateFormFields();
            loadDoctors();
            var today = new Date().toISOString().split('T')[0];
            document.getElementById("appointmentDate").setAttribute('min', today);
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>🏥 Manage Appointment</h1>
        <p class="subtitle">Book 30-minute consultation slots with smart tokens</p>

        <form action="ManageAppointmentServlet" method="post" onsubmit="return validateForm();">
            <div class="radio-group">
                <label class="radio-label active">
                    <input type="radio" name="action" value="book" checked onclick="updateFormFields()"> 📅 Book Slot
                </label>
                <label class="radio-label">
                    <input type="radio" name="action" value="update" onclick="updateFormFields()"> ✏️ Reschedule
                </label>
                <label class="radio-label">
                    <input type="radio" name="action" value="cancel" onclick="updateFormFields()"> ❌ Cancel
                </label>
            </div>

            <div class="form-group">
                <label for="appointmentId">Appointment ID:</label>
                <input type="text" id="appointmentId" name="appointmentId">
            </div>

            <div class="form-group booking-field">
                <label for="doctorName">👨‍⚕️ Select Doctor (by Specialty):</label>
                <select id="doctorName" name="doctorName" required>
                    <option value="">-- Choose Doctor by Specialty --</option>
                    <option value="Dr. A. K. Sharma">Dr. A. K. Sharma (Cardiology)</option>
                    <option value="Dr. Priya Verma">Dr. Priya Verma (Dermatology)</option>
                    <option value="Dr. Rajesh Mehta">Dr. Rajesh Mehta (Orthopedics)</option>
                </select>
            </div>

            <div class="form-group booking-field">
                <label for="patientId">Patient Phone No / ID:</label>
                <input type="text" id="patientId" name="patientId" placeholder="e.g. 9876543210 or P-501">
            </div>

            <div class="form-group booking-field">
                <label for="patientName">Patient Full Name:</label>
                <input type="text" id="patientName" name="patientName" placeholder="e.g. Rahul Kumar">
            </div>

            <div class="form-group booking-field">
                <label for="appointmentDate">Appointment Date:</label>
                <input type="date" id="appointmentDate" name="appointmentDate">
            </div>

            <div class="form-group booking-field">
                <label for="timeSlot">⏱️ 30-Minute Time Slot (Max 3 Patients):</label>
                <select id="timeSlot" name="timeSlot" required>
                    <option value="">-- Select 30-Minute Time Window --</option>
                    <optgroup label="Morning Session">
                        <option value="09:00 AM - 09:30 AM">09:00 AM - 09:30 AM</option>
                        <option value="09:30 AM - 10:00 AM">09:30 AM - 10:00 AM</option>
                        <option value="10:00 AM - 10:30 AM">10:00 AM - 10:30 AM</option>
                        <option value="10:30 AM - 11:00 AM">10:30 AM - 11:00 AM</option>
                        <option value="11:00 AM - 11:30 AM">11:00 AM - 11:30 AM</option>
                        <option value="11:30 AM - 12:00 PM">11:30 AM - 12:00 PM</option>
                    </optgroup>
                    <optgroup label="Afternoon / Evening Session">
                        <option value="02:00 PM - 02:30 PM">02:00 PM - 02:30 PM</option>
                        <option value="02:30 PM - 03:00 PM">02:30 PM - 03:00 PM</option>
                        <option value="03:00 PM - 03:30 PM">03:00 PM - 03:30 PM</option>
                        <option value="03:30 PM - 04:00 PM">03:30 PM - 04:00 PM</option>
                        <option value="04:00 PM - 04:30 PM">04:00 PM - 04:30 PM</option>
                        <option value="04:30 PM - 05:00 PM">04:30 PM - 05:00 PM</option>
                    </optgroup>
                </select>
                <div class="slot-badge">ℹ️ <strong>Capacity Rule:</strong> Up to 3 patients are allotted per 30-min window (~10 mins per consultation). Sequential queue tokens are issued upon booking.</div>
            </div>

            <input type="submit" value="Confirm Appointment">
        </form>

        <div class="nav-links-footer">
            <a href="dashboard.html">← Return to Dashboard</a>
            <a href="Prescription.html">View Prescriptions →</a>
        </div>
    </div>
</body>
</html>
