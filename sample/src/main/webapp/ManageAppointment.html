<!DOCTYPE html>
<html>
<head>
    <title>Manage Appointment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('images/Dc2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 85%;
            max-width: 650px;
            margin: 30px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
        }
        h1 {
            text-align: center;
            color: #1e3a5f;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        input[type="text"], input[type="date"], select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff;
        }
        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            border-color: #2e7d32;
            outline: none;
            box-shadow: 0 0 5px rgba(46, 125, 50, 0.3);
        }
        .radio-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: #f0f4f8;
            padding: 10px 15px;
            border-radius: 8px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0;
            cursor: pointer;
            font-weight: 600;
            color: #1e3a5f;
        }
        .slot-badge {
            background-color: #e3f2fd;
            border-left: 4px solid #1976d2;
            padding: 8px 12px;
            font-size: 12px;
            color: #0d47a1;
            margin-top: 5px;
            border-radius: 0 4px 4px 0;
        }
        input[type="submit"] {
            background-color: #2e7d32;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        input[type="submit"]:hover {
            background-color: #1b5e20;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
            color: #1976d2;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        function validateForm() {
            var action = document.querySelector('input[name="action"]:checked').value;
            var appointmentId = document.getElementById("appointmentId").value;
            var doctorName = document.getElementById("doctorName").value;
            var patientId = document.getElementById("patientId").value;
            var patientName = document.getElementById("patientName").value;
            var appointmentDate = document.getElementById("appointmentDate").value;
            var timeSlot = document.getElementById("timeSlot").value;

            if (action === "book" || action === "update") {
                if (!doctorName || !patientId || !patientName || !appointmentDate || !timeSlot) {
                    alert("Please fill out all required fields, including Doctor selection and Time Slot.");
                    return false;
                }
            } else if (action === "cancel") {
                if (!appointmentId) {
                    alert("Please enter the appointment ID to cancel.");
                    return false;
                }
            }
            return true;
        }

        function updateFormFields() {
            var action = document.querySelector('input[name="action"]:checked').value;
            var formGroups = document.querySelectorAll('.booking-field');
            var appointmentIdField = document.getElementById("appointmentId");

            if (action === "cancel") {
                appointmentIdField.removeAttribute("readonly");
                appointmentIdField.value = "";
                formGroups.forEach(el => el.style.display = "none");
            } else {
                formGroups.forEach(el => el.style.display = "block");
                if (action === "book") {
                    generateAppointmentId();
                    appointmentIdField.setAttribute("readonly", true);
                } else {
                    appointmentIdField.removeAttribute("readonly");
                }
            }
        }

        function generateAppointmentId() {
            document.getElementById("appointmentId").value = "APPT" + Math.floor(1000 + Math.random() * 9000);
        }

        // Dynamically load doctor list from database API
        function loadDoctors() {
            fetch('DoctorServlet?action=json')
                .then(response => {
                    if (response.ok) return response.json();
                    return null;
                })
                .then(data => {
                    if (data && data.length > 0) {
                        var select = document.getElementById("doctorName");
                        select.innerHTML = '<option value="">-- Choose Doctor by Specialty --</option>';
                        data.forEach(function(doc) {
                            var opt = document.createElement("option");
                            opt.value = doc.name;
                            opt.textContent = doc.name + " (" + doc.specialty + ")";
                            select.appendChild(opt);
                        });
                    }
                })
                .catch(err => {
                    console.log("Using default doctor list:", err);
                });
        }

        window.onload = function() {
            updateFormFields();
            loadDoctors();
            // Set min date to today
            var today = new Date().toISOString().split('T')[0];
            document.getElementById("appointmentDate").setAttribute('min', today);
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>🏥 Manage Appointment</h1>
        <form action="ManageAppointmentServlet" method="post" onsubmit="return validateForm();">
            <div class="radio-group">
                <label><input type="radio" name="action" value="book" checked onclick="updateFormFields()"> Book</label>
                <label><input type="radio" name="action" value="update" onclick="updateFormFields()"> Update</label>
                <label><input type="radio" name="action" value="cancel" onclick="updateFormFields()"> Cancel</label>
            </div>

            <div class="form-group">
                <label for="appointmentId">Appointment ID:</label>
                <input type="text" id="appointmentId" name="appointmentId">
            </div>

            <div class="form-group booking-field">
                <label for="doctorName">👨‍⚕️ Select Doctor (by Specialty):</label>
                <select id="doctorName" name="doctorName" required>
                    <option value="">-- Choose Doctor by Specialty --</option>
                    <option value="Dr. A. K. Sharma">Dr. A. K. Sharma (Cardiology)</option>
                    <option value="Dr. Priya Verma">Dr. Priya Verma (Dermatology)</option>
                    <option value="Dr. Rajesh Mehta">Dr. Rajesh Mehta (Orthopedics)</option>
                </select>
            </div>

            <div class="form-group booking-field">
                <label for="patientId">Patient Ph. No / ID:</label>
                <input type="text" id="patientId" name="patientId" placeholder="e.g. 9876543210 or P-501">
            </div>

            <div class="form-group booking-field">
                <label for="patientName">Patient Name:</label>
                <input type="text" id="patientName" name="patientName" placeholder="e.g. Rahul Kumar">
            </div>

            <div class="form-group booking-field">
                <label for="appointmentDate">Appointment Date:</label>
                <input type="date" id="appointmentDate" name="appointmentDate">
            </div>

            <div class="form-group booking-field">
                <label for="timeSlot">⏱️ 30-Minute Time Slot (Max 3 Patients):</label>
                <select id="timeSlot" name="timeSlot" required>
                    <option value="">-- Select 30-Minute Time Window --</option>
                    <optgroup label="Morning Session">
                        <option value="09:00 AM - 09:30 AM">09:00 AM - 09:30 AM</option>
                        <option value="09:30 AM - 10:00 AM">09:30 AM - 10:00 AM</option>
                        <option value="10:00 AM - 10:30 AM">10:00 AM - 10:30 AM</option>
                        <option value="10:30 AM - 11:00 AM">10:30 AM - 11:00 AM</option>
                        <option value="11:00 AM - 11:30 AM">11:00 AM - 11:30 AM</option>
                        <option value="11:30 AM - 12:00 PM">11:30 AM - 12:00 PM</option>
                    </optgroup>
                    <optgroup label="Afternoon / Evening Session">
                        <option value="02:00 PM - 02:30 PM">02:00 PM - 02:30 PM</option>
                        <option value="02:30 PM - 03:00 PM">02:30 PM - 03:00 PM</option>
                        <option value="03:00 PM - 03:30 PM">03:00 PM - 03:30 PM</option>
                        <option value="03:30 PM - 04:00 PM">03:30 PM - 04:00 PM</option>
                        <option value="04:00 PM - 04:30 PM">04:00 PM - 04:30 PM</option>
                        <option value="04:30 PM - 05:00 PM">04:30 PM - 05:00 PM</option>
                    </optgroup>
                </select>
                <div class="slot-badge">ℹ️ Limit: Maximum 3 tokens are allotted per 30-minute slot (approx 10 mins per patient).</div>
            </div>

            <input type="submit" value="Submit Appointment">
        </form>
        <a href="dashboard.html">← Return to Dashboard</a>
    </div>
</body>
</html>
