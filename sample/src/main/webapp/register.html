<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>DocPortal - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.75), rgba(13, 148, 136, 0.65)), url('images/Sign.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 24px 14px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            padding: clamp(22px, 5vw, 38px);
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 6px;
            color: #0f172a;
            text-align: center;
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.88rem;
            margin-bottom: 22px;
        }

        .role-switch {
            display: flex;
            gap: 8px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .role-btn {
            flex: 1;
            text-align: center;
            padding: 10px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: clamp(0.82rem, 2.5vw, 0.92rem);
            color: #64748b;
            transition: all 0.2s;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 42px;
        }

        .role-btn.active {
            background: #0284c7;
            color: #fff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: #334155;
            font-size: 0.86rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 13px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            color: #0f172a;
            font-size: 16px; /* Prevents auto zoom on mobile Safari */
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #0284c7;
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.18);
        }

        .doctor-fields {
            background: #f0fdf4;
            border-left: 4px solid #16a34a;
            padding: 16px 14px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 16px;
            border: 1px solid #dcfce7;
            border-left-width: 4px;
        }

        .doctor-fields .section-title {
            font-size: 0.8rem;
            font-weight: 800;
            color: #15803d;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            transition: all 0.25s;
            margin-top: 8px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
            min-height: 48px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
        }

        .form-footer {
            margin-top: 22px;
            text-align: center;
            font-size: 0.88rem;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }

        .form-footer a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 700;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-block;
            margin-top: 10px;
            color: #64748b;
            font-size: 0.82rem;
            text-decoration: none;
            font-weight: 600;
        }

        .back-home:hover {
            color: #0f172a;
        }

        @media (max-width: 400px) {
            .role-switch {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create DocPortal Account</h2>
        <div class="subtitle">Join as a Doctor or Patient</div>

        <!-- Role Toggle Buttons -->
        <div class="role-switch">
            <div class="role-btn active" id="btnPatient" onclick="selectRole('Patient')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                I am a Patient
            </div>
            <div class="role-btn" id="btnDoctor" onclick="selectRole('Doctor')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>
                I am a Doctor
            </div>
        </div>

        <form action="RegisterServlet" method="post" onsubmit="return validateRegistration();">
            <input type="hidden" id="roleInput" name="role" value="Patient">

            <!-- Common Fields -->
            <div class="form-group">
                <label for="username">Username (for Login):</label>
                <input type="text" id="username" name="t1" required placeholder="Choose a unique username" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="t2" required placeholder="e.g. user@gmail.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="phone">Contact Number / Phone:</label>
                <input type="tel" id="phone" name="phone" required placeholder="e.g. 9876543210" autocomplete="tel">
            </div>

            <!-- Doctor Specific Profile Fields -->
            <div id="doctorFieldsBox" class="doctor-fields" style="display:none;">
                <div class="section-title">👨‍⚕️ Doctor Credentials (Requires Admin Verification)</div>
                
                <div class="form-group">
                    <label for="doctorFullName">Doctor Official Full Name:</label>
                    <input type="text" id="doctorFullName" name="doctorFullName" placeholder="e.g. Dr. Rajesh Verma">
                </div>

                <div class="form-group">
                    <label for="specialty">Medical Specialty:</label>
                    <select id="specialty" name="specialty">
                        <option value="General Medicine">General Medicine</option>
                        <option value="Cardiology">Cardiology</option>
                        <option value="Dermatology">Dermatology</option>
                        <option value="Orthopedics">Orthopedics</option>
                        <option value="Pediatrics">Pediatrics</option>
                        <option value="Neurology">Neurology</option>
                        <option value="Gynecology">Gynecology</option>
                        <option value="ENT">ENT (Ear, Nose, Throat)</option>
                        <option value="Ophthalmology">Ophthalmology</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="t3" required placeholder="Create a secure password" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="t4" required placeholder="Re-type your password" autocomplete="new-password">
            </div>

            <input type="submit" value="Register Now" class="btn-submit">
        </form>

        <div class="form-footer">
            <p>Already registered? <a href="Login.html">Sign In here</a></p>
            <a href="Welcome.html" class="back-home">← Back to Homepage</a>
        </div>
    </div>

    <script>
        function selectRole(role) {
            document.getElementById('roleInput').value = role;
            const btnPatient = document.getElementById('btnPatient');
            const btnDoctor = document.getElementById('btnDoctor');
            const doctorBox = document.getElementById('doctorFieldsBox');
            const doctorNameInput = document.getElementById('doctorFullName');

            if (role === 'Doctor') {
                btnDoctor.classList.add('active');
                btnPatient.classList.remove('active');
                doctorBox.style.display = 'block';
                doctorNameInput.required = true;
            } else {
                btnPatient.classList.add('active');
                btnDoctor.classList.remove('active');
                doctorBox.style.display = 'none';
                doctorNameInput.required = false;
            }
        }

        function validateRegistration() {
            const p1 = document.getElementById('password').value;
            const p2 = document.getElementById('confirmPassword').value;
            if (p1 !== p2) {
                alert("Passwords do not match! Please check and re-type.");
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
