<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>DocPortal - Portal Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {   
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.75), rgba(13, 148, 136, 0.65)), url('images/Sign.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 20px 16px;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            padding: clamp(24px, 5vw, 40px);
            max-width: 440px;
            width: 100%;
            color: #0f172a;
            position: relative;
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e0f2fe;
            color: #0369a1;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-header h2 {
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .login-header p {
            font-size: 0.88rem;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 0.88rem;
            color: #334155;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            color: #0f172a;
            font-size: 16px; /* 16px prevents iOS zoom */
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: #0284c7;
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.18);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
            margin-top: 8px;
            min-height: 48px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
        }

        .form-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.88rem;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            padding-top: 18px;
        }

        .form-footer a {
            color: #0284c7;
            font-weight: 700;
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-block;
            margin-top: 14px;
            color: #64748b;
            font-size: 0.82rem;
            text-decoration: none;
            font-weight: 600;
        }

        .back-home:hover {
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-header">
            <div class="brand-badge">DocConnect Unified Access</div>
            <h2>Sign In to Portal</h2>
            <p>Access your Patient, Doctor, or Admin account</p>
        </div>

        <form name="login" action="LoginServlet" method="get">
            <div class="form-group">
                <label for="username">Username / Patient Phone:</label>
                <input type="text" id="username" name="t1" required placeholder="Enter username or phone number" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="t2" required placeholder="Enter password" autocomplete="current-password">
            </div>

            <button type="submit" class="submit-btn">Sign In to Dashboard</button>

            <div class="form-footer">
                <p>New to DocConnect? <a href="register.html">Create free account</a></p>
                <a href="Welcome.html" class="back-home">← Back to Homepage</a>
            </div>
        </form>
    </div>
</body>
</html>
